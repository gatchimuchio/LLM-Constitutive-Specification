name: 日本語正本監査

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 規定構造監査
        run: python scripts/規定監査.py
      - name: 単体試験
        run: python -m unittest discover -s tests -p 'test_*.py'
